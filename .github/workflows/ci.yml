name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  network-invariant-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Zero Network checker
        run: python3 .github/scripts/test_network_invariant.py

      - name: Source manifest, sources and dependencies must not use the network
        run: python3 .github/scripts/check_network_invariant.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Merged manifest must not contain INTERNET
        run: python3 .github/scripts/check_network_invariant.py --require-merged

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: skhoron-vault-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7